services:
  # No published port on purpose: `up` must not fail because the reviewer's machine
  # already runs something on 5432. Query it with `docker compose exec db psql ...`.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulk_import
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulk_import"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bulk_import
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Behind a profile, so `docker compose up` starts the service and not the test suite.
  # `docker compose run --rm tests` still works, and that is the documented command.
  tests:
    profiles: ["test"]
    build: .
    environment:
      TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/bulk_import_test
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest"]

volumes:
  db-data:
