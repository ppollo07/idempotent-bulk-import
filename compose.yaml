services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulk_import
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulk_import"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bulk_import
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  tests:
    profiles: ["test"]
    build: .
    environment:
      TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/bulk_import_test
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest"]

volumes:
  db-data:
